[project]
name = "agentflow"
version = "0.1.0"
description = "Autonomous software development factory powered by specialized AI agents"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "anthropic>=0.39.0",
    "pydantic>=2.0",
    "rich>=13.0",
    "typer>=0.9",
    "uvicorn>=0.24",
    "fastapi>=0.104",
    "websockets>=12.0",
    "gitpython>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.0",
    "ruff>=0.1",
]

[project.scripts]
agentflow = "src.interface.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
